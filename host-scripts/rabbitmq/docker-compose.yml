services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rpsd-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rabbitmq-network

volumes:
  rabbitmq-data:
    driver: local

networks:
  rabbitmq-network:
    driver: bridge
