[project]
name = "rpsd-storage"
version = "0.1.0"
description = "Storage utilities (part of rpsd-commons)"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Agenzia TPL" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3==1.39.14",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Agenzia-TPL/rpsd-commons"
Repository = "https://github.com/Agenzia-TPL/rpsd-commons"
Issues = "https://github.com/Agenzia-TPL/rpsd-commons/issues"

[tool.uv.sources]
# Internal workspace dependencies
#my-collection-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
