[project]
name = "rpsd-settings"
version = "0.1.0"
description = "Composable settings system for rpsd-commons (OPTIONAL convenience package)"
readme = "README.md"
authors = [
    { name = "caipirginka" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rpsd-storage",
    "rpsd-transport",
]

[tool.uv.sources]
# Internal workspace dependencies
rpsd-storage = { workspace = true }
rpsd-transport = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
