[project]
name = "rpsd-transport"
version = "0.1.0"
description = "Data transport utilities (part of rpsd-commons)"
readme = "README.md"
authors = [
    { name = "caipirginka", email = "github@oicom.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.0,<0.117.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rpsd-storage",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "respx>=0.22.0",
]

[tool.uv.sources]
# Internal workspace dependencies
rpsd-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
