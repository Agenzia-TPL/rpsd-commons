[project]
name = "rpsd-transport"
# IMPORTANT: This version must match the version in all other packages in this
# workspace (root pyproject.toml and all packages/*/pyproject.toml).
# When releasing, update all of them to the same value and open a PR to main.
# A git tag is created automatically by CI when the PR is merged.
version = "0.2.0"
description = "Data transport utilities (part of rpsd-commons)"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Agenzia TPL" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.0,<0.117.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rpsd-storage",
]

[project.optional-dependencies]
kafka = [
    "aiokafka>=0.10.0",
]
rabbitmq = [
    "aio-pika>=9.0.0",
]
test = [
    "pytest>=8.0.0",
    "respx>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/Agenzia-TPL/rpsd-commons"
Repository = "https://github.com/Agenzia-TPL/rpsd-commons"
Issues = "https://github.com/Agenzia-TPL/rpsd-commons/issues"

[tool.uv.sources]
# Internal workspace dependencies
rpsd-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
