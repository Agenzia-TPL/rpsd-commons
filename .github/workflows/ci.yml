name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -m "not integration" || [ $? -eq 5 ]
