[project]
name = "fastapi-ingest-app"
version = "1.0.0"
description = "Example FastAPI application using rpsd-transport, rpsd-storage and rpsd-flow"
license = "BSD-3-Clause"
authors = [
    { name = "Agenzia TPL" }
]
requires-python = ">=3.13"
dependencies = [
    "rpsd-transport[kafka,rabbitmq]",
    "rpsd-storage",
    "rpsd-flow",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.24.0",
]

[tool.uv.sources]
rpsd-transport = { workspace = true }
rpsd-storage = { workspace = true }
rpsd-flow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
fastapi-ingest-app = "fastapi_ingest_app.main:run"
consumer = "fastapi_ingest_app.consumer:main"
sample-flow = "fastapi_ingest_app.sample_flow:serve"
sample-task = "fastapi_ingest_app.sample_flow:serve_task"
serve-validate = "fastapi_ingest_app.subflow_example:serve_validate"
serve-ingest = "fastapi_ingest_app.subflow_example:serve_ingest"
