[project]
name = "rpsd-commons"
version = "0.1.0"
description = "Collection of common useful packages"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Agenzia TPL" }
]
requires-python = ">=3.13"
dependencies = [
    # Tell uv these dependencies come from workspace, not PyPI
    "rpsd-transport",
    "rpsd-storage",
    "rpsd-flow",
    "rpsd-settings",
]

[project.urls]
Homepage = "https://github.com/Agenzia-TPL/rpsd-commons"
Repository = "https://github.com/Agenzia-TPL/rpsd-commons"
Issues = "https://github.com/Agenzia-TPL/rpsd-commons/issues"

[tool.uv.sources]
rpsd-transport = { workspace = true }
rpsd-storage = { workspace = true }
rpsd-flow = { workspace = true }
rpsd-settings = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "examples/fastapi_ingest_app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.13.1",
    "pytest>=8.0.0",
    "moto[s3]>=5.0.0",
    "respx>=0.20.0",
    "hypothesis>=6.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.11.0",
    "pip-licenses>=5.5.1",
]

[tool.ruff]
target-version = "py313"
src = ["packages/*/src", "examples/*/src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"packages/*/examples/*" = ["N999"]
"examples/*/src/*" = ["N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "fs: marks tests as related to the file system storage provider",
    "s3: marks tests as related to the S3 storage provider",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as performance benchmarks",
    "slow: marks tests as slow-running tests",
    "property: marks tests as property-based tests",
    "unit: marks tests as unit tests",
]
